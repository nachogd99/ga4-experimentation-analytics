
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'ga4_analytics'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'ga4_analytics'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Project variables
# Date range of raw GA4 daily tables to read, in the YYYYMMDD format used by
# _TABLE_SUFFIX. Filtering on _TABLE_SUFFIX limits how many bytes BigQuery scans.
# The public sample dataset covers 20201101 to 20210131.
# Override for a cheaper test run, for example:
#   dbt run --vars '{ga4_start_date: "20210101", ga4_end_date: "20210107"}'
vars:
  ga4_start_date: '20201101'
  ga4_end_date: '20210131'

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# These settings can be overridden in the individual model files using the
# `{{ config(...) }}` macro.
models:
  ga4_analytics:
    # Config indicated by + and applies to all files under models/staging/
    staging:
      # Tables (not views) so downstream models read our small flattened copy
      # instead of rescanning the raw GA4 data on every query.
      +materialized: table
    # Config indicated by + and applies to all files under models/intermediate/
    intermediate:
      # Also tables: they are small, and every mart reads them. As views, each
      # mart query would rescan stg_events.
      +materialized: table
    # Config indicated by + and applies to all files under models/marts/
    marts:
      # Tables, so the analysis code and the app read finished results
      # without recomputing them.
      +materialized: table
